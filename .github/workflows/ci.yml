name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CI: true

jobs:
  root:
    name: Root and Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JWT_ACCOUNT_ACCESS_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      JWT_ACCOUNT_REFRESH_SECRET: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      JWT_DEVICE_ACCESS_SECRET: cccccccccccccccccccccccccccccccc
      JWT_DEVICE_REFRESH_SECRET: dddddddddddddddddddddddddddddddd
      JWT_AUDIT_ACCESS_SECRET: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
      JWT_ISSUER: verigate-ci-compose-validation
      ENCRYPTION_KEY: ffffffffffffffffffffffffffffffff
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Verify QR contract fixtures
        run: npm run verify:qr-contract-fixtures

      - name: Reject unsupported public capability claims
        run: |
          node -e '
            const fs = require("fs");
            const checks = [
              ["README.md", "supporting 500+ users"],
              ["verigate-scan/README.md", "multiple scanner accounts can log in/out on one device"],
              ["verigate-scan/README.md", "Every app start verifies a SHA-256 checksum of the database contents"],
              ["README.md", "Repository release evidence covers signed Android cloud build/publication"],
              ["verigate-scan/README.md", "Repository release evidence covers signed Android cloud build/publication"]
            ];
            for (const [path, unsupported] of checks) {
              if (fs.readFileSync(path, "utf8").includes(unsupported)) {
                throw new Error(`${path} contains unsupported claim: ${unsupported}`);
              }
            }
          '

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run type-check
      - run: npm run build
      - run: npm test -- --runInBand

  database-runtime:
    name: Database runtime (${{ matrix.lineage }}, ${{ matrix.timezone }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - lineage: blank
            timezone: UTC
            application-contracts: true
          - lineage: historical
            timezone: UTC
            application-contracts: true
          - lineage: current
            timezone: UTC
            application-contracts: true
          - lineage: blank
            timezone: America/New_York
            application-contracts: false
          - lineage: blank
            timezone: Asia/Kolkata
            application-contracts: false
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: accreditation_system
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accreditation_system"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      RUN_CONTRACT_RUNTIME: true
      MIGRATION_TEST_LINEAGE: ${{ matrix.lineage }}
      TZ: ${{ matrix.timezone }}
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: accreditation_system
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSL: false
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_REQUIRED: true
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - name: Verify fresh setup and idempotent migration command
        run: |
          npm run setup:db
          npm run migrate:db
      - name: Run migration runtime contracts
        run: >-
          npm test -- --runInBand
          server/__tests__/database-migrations.runtime.test.ts
      - name: Run application runtime contracts
        if: matrix.application-contracts
        run: >-
          npm test -- --runInBand
          server/__tests__/runtime-contracts.test.ts
      - name: Run composed authorization matrix
        if: matrix.application-contracts
        run: >-
          npm test -- --runInBand
          server/__tests__/authorization-matrix.runtime.test.ts
      - name: Run aggregate domain workflow contracts
        if: matrix.application-contracts
        run: >-
          npm test -- --runInBand
          server/__tests__/domain-workflows.runtime.test.ts
      - name: Run Redis loss and recovery contracts
        if: matrix.application-contracts
        run: >-
          npm test -- --runInBand
          server/__tests__/redis-lifecycle.runtime.test.ts

  dashboard:
    name: Web dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-dashboard
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web-dashboard/package-lock.json

      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - name: Run dashboard tests deterministically
        run: npm exec -- vitest run --maxWorkers=1
      - run: npm run build

  mobile:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: VeriGate Pass
            directory: verigate-pass
            lockfile: verigate-pass/package-lock.json
          - name: VeriGate Scan
            directory: verigate-scan
            lockfile: verigate-scan/package-lock.json
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}

      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - name: Run deterministic mobile contracts
        run: npm test
      - run: npm run doctor

  compatibility-smoke:
    name: Assembled blank-stack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web-dashboard/package-lock.json

      - name: Install smoke-driver dependencies
        run: |
          npm ci
          npm --prefix backend ci
          npm --prefix web-dashboard ci

      - name: Install compatibility browser
        working-directory: web-dashboard
        run: npm exec -- playwright install --with-deps chromium

      - name: Validate compatibility harness contracts
        run: npm run compatibility:test

      - name: Run blank-stack smoke with ephemeral authority material
        run: npm run compatibility:run

      - name: Upload redacted smoke evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: compatibility-artifacts/
          if-no-files-found: warn
          retention-days: 14

  compatibility-full:
    name: Assembled identity and access compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web-dashboard/package-lock.json
            verigate-pass/package-lock.json
            verigate-scan/package-lock.json

      - name: Install all compatibility dependencies
        run: npm run ci:all

      - name: Install compatibility browser
        working-directory: web-dashboard
        run: npm exec -- playwright install --with-deps chromium

      - name: Validate compatibility harness contracts
        run: npm run compatibility:test

      - name: Run all assembled compatibility scenarios
        run: npm run compatibility:convergence

      - name: Upload redacted compatibility evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: compatibility-artifacts/
          if-no-files-found: warn
          retention-days: 14
