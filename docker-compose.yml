services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: accreditation-postgres
    environment:
      POSTGRES_DB: accreditation_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d accreditation_system"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - accreditation-network

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: accreditation-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - accreditation-network

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: accreditation-backend
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=accreditation_system
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_ACCOUNT_ACCESS_SECRET=${JWT_ACCOUNT_ACCESS_SECRET:?JWT_ACCOUNT_ACCESS_SECRET is required}
      - JWT_ACCOUNT_REFRESH_SECRET=${JWT_ACCOUNT_REFRESH_SECRET:?JWT_ACCOUNT_REFRESH_SECRET is required}
      - JWT_DEVICE_ACCESS_SECRET=${JWT_DEVICE_ACCESS_SECRET:?JWT_DEVICE_ACCESS_SECRET is required}
      - JWT_DEVICE_REFRESH_SECRET=${JWT_DEVICE_REFRESH_SECRET:?JWT_DEVICE_REFRESH_SECRET is required}
      - JWT_AUDIT_ACCESS_SECRET=${JWT_AUDIT_ACCESS_SECRET:?JWT_AUDIT_ACCESS_SECRET is required}
      - JWT_ISSUER=${JWT_ISSUER:?JWT_ISSUER is required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - QR_AUTHORITY_PRIVATE_KEY_BASE64=${QR_AUTHORITY_PRIVATE_KEY_BASE64:-}
      - APNS_ENABLED=false
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    networks:
      - accreditation-network
    restart: unless-stopped

  # Web Dashboard (Nginx serving React build)
  web-dashboard:
    build:
      context: ./web-dashboard
      dockerfile: Dockerfile
    container_name: accreditation-web
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - accreditation-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  accreditation-network:
    driver: bridge
